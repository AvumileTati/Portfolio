<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bg)"/>
  <rect width="800" height="500" rx="20" fill="url(#glow)"/>
  
  <!-- Outer decorative border -->
  <rect x="24" y="24" width="752" height="452" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="436" rx="10" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Top badge header -->
  <g transform="translate(60, 65)">
    <rect width="210" height="34" rx="17" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">DEMAND ACADEMY 1</text>
  </g>

  <!-- Status pill -->
  <g transform="translate(560, 65)">
    <rect width="180" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">ACTIVE TRAINEE 2026</text>
  </g>

  <!-- Insignia Icon Graphic -->
  <g transform="translate(400, 195)">
    <!-- Hexagon shield -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="rgba(37,99,235,0.25)" stroke="url(#gold)" stroke-width="3"/>
    <!-- Headset / Support Icon -->
    <path d="M-24,6 C-24,-12 -12,-24 0,-24 C12,-24 24,-12 24,6 L24,18 C24,24 18,28 12,28 L-12,28 C-18,28 -24,24 -24,18 Z" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-24" cy="12" r="7" fill="#38bdf8"/>
    <circle cx="24" cy="12" r="7" fill="#38bdf8"/>
    <path d="M12,28 C12,36 4,40 -6,40 L-10,40" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-14" cy="40" r="3" fill="#fbbf24"/>
  </g>

  <!-- Main Title -->
  <text x="400" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">CAPACITI SERVICE DESK ACADEMY</text>
  
  <!-- Subtitle -->
  <text x="400" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">The Cape Innovation &amp; Technology Initiative (CiTi) • UVU Africa</text>

  <!-- Tags / Specializations -->
  <g transform="translate(400, 395)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Cape Town Aug 2026 Cohort • Enterprise IT Service Management • SharePoint Portfolio</text>
  </g>

  <!-- Bottom Accent bar -->
  <rect x="180" y="425" width="440" height="4" rx="2" fill="url(#accent)"/>
</svg>
